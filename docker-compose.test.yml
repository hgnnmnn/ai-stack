# Stand-in for the real halogen Backend (ADR 0009), used to test the litellm
# Gateway's routing, Key scoping, and usage logging without a GPU. One stub,
# because halogen serves exactly one model -- see ADR 0009 for why llama-coder
# and llama-fim are gone.
#
#   docker compose -p ai-stack-test -f docker-compose.yml -f docker-compose.test.yml up -d --build
#
# Published ports are remapped off the real stack's (4000/9090/3000) and bound
# to localhost, so this can run alongside a live Gateway. See tests/test.env.

services:
    halogen:
        image: ai-stack-halogen-stub
        build: ./tests/stubs
        command: ["python", "/server.py"]
        environment:
            # The Model ID, not the service name: the real Backend is told the
            # same thing via HALOGEN_MODEL_ID in
            # docker-compose.backends-halogen.yml.
            STUB_MODEL_ID: llama-chat
            STUB_PORT: "8731"
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen('http://localhost:8731/health')",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    litellm:
        ports: !override
            - "127.0.0.1:${GATEWAY_PORT}:4000"
        depends_on:
            halogen:
                condition: service_healthy
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    prometheus:
        ports: !override
            - "127.0.0.1:${PROMETHEUS_PORT}:9090"

    grafana:
        ports: !override
            - "127.0.0.1:${GRAFANA_PORT}:3000"
