# Stand-ins for the real llama.cpp Backends (issues #2/#3), used to test the
# litellm Gateway's routing, Key scoping, and usage logging without a GPU.
#
#   docker compose -p ai-stack-test -f docker-compose.yml -f docker-compose.test.yml up -d --build
#
# Published ports are remapped off the real stack's (4000/9090/3000) and bound
# to localhost, so this can run alongside a live Gateway. See tests/test.env.

services:
    llama-chat:
        image: ai-stack-llama-chat-stub
        build: ./tests/stubs
        command: ["python", "/server.py"]
        environment:
            STUB_MODEL_ID: llama-chat
            STUB_PORT: "8001"
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    llama-coder:
        image: ai-stack-llama-coder-stub
        build: ./tests/stubs
        command: ["python", "/server.py"]
        environment:
            STUB_MODEL_ID: llama-coder
            STUB_PORT: "8002"
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    litellm:
        ports: !override
            - "127.0.0.1:${GATEWAY_PORT}:4000"
        depends_on:
            llama-chat:
                condition: service_healthy
            llama-coder:
                condition: service_healthy
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    prometheus:
        ports: !override
            - "127.0.0.1:${PROMETHEUS_PORT}:9090"

    grafana:
        ports: !override
            - "127.0.0.1:${GRAFANA_PORT}:3000"
