# Real llama.cpp Backends (issues #2/#3) - GPU-passthrough services for the
# Strix Halo iGPU (Vulkan/RADV, see ADR 0003). Host-specific (devices,
# group_add GIDs, model paths), so kept out of docker-compose.yml: that file
# stays portable and is what docker-compose.test.yml overlays with stub
# Backends for ./tests/run.sh.
#
# Combine with docker-compose.yml for production:
#
#   docker compose -f docker-compose.yml -f docker-compose.backends.yml up -d
#
# Or set COMPOSE_FILE=docker-compose.yml:docker-compose.backends.yml in .env
# so plain `docker compose up -d` picks up both files (see .env.example).

services:
    llama-chat:
        image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11515
        restart: unless-stopped
        ulimits:
            memlock: -1
        ports:
            - "127.0.0.1:8001:8001"
        devices:
            - /dev/dri:/dev/dri
        group_add:
            - "${RENDER_GID}"
            - "${VIDEO_GID}"
        volumes:
            - ${MODELS_DIR}:/models:ro,z
        environment:
            MODEL_FILE: ${CHAT_MODEL_FILE}
            MMPROJ_FILE: ${CHAT_MMPROJ_FILE:-}
            LLAMA_ARGS: ${CHAT_ARGS:?set CHAT_ARGS in .env}
        # Everything but model, projector and port comes from CHAT_ARGS in .env
        # (unquoted word-splitting, so no spaces inside a single argument).
        entrypoint:
            - sh
            - -c
            - exec /app/llama-server -m "/models/$$MODEL_FILE" $${MMPROJ_FILE:+--mmproj "/models/$$MMPROJ_FILE"} --port 8001 $$LLAMA_ARGS
        healthcheck:
            test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 300s

    llama-coder:
        image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11515
        restart: unless-stopped
        ulimits:
            memlock: -1
        ports:
            - "127.0.0.1:8002:8002"
        devices:
            - /dev/dri:/dev/dri
        group_add:
            - "${RENDER_GID}"
            - "${VIDEO_GID}"
        volumes:
            - ${MODELS_DIR}:/models:ro,z
        environment:
            MODEL_FILE: ${CODER_MODEL_FILE}
            MMPROJ_FILE: ${CODER_MMPROJ_FILE:-}
            LLAMA_ARGS: ${CODER_ARGS:?set CODER_ARGS in .env}
        # Everything but model, projector and port comes from CODER_ARGS in .env
        # (unquoted word-splitting, so no spaces inside a single argument).
        entrypoint:
            - sh
            - -c
            - exec /app/llama-server -m "/models/$$MODEL_FILE" $${MMPROJ_FILE:+--mmproj "/models/$$MMPROJ_FILE"} --port 8002 $$LLAMA_ARGS
        healthcheck:
            test: ["CMD", "curl", "-sf", "http://localhost:8002/health"]
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 300s

    llama-fim:
        image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11515
        restart: unless-stopped
        ulimits:
            memlock: -1
        ports:
            - "127.0.0.1:8004:8004"
        devices:
            - /dev/dri:/dev/dri
        group_add:
            - "${RENDER_GID}"
            - "${VIDEO_GID}"
        volumes:
            - ${MODELS_DIR}:/models:ro,z
        environment:
            MODEL_FILE: ${FIM_MODEL_FILE}
            LLAMA_ARGS: ${FIM_ARGS:?set FIM_ARGS in .env}
        # Everything but model, projector and port comes from FIM_ARGS in .env
        # (unquoted word-splitting, so no spaces inside a single argument).
        entrypoint:
            - sh
            - -c
            - exec /app/llama-server -m "/models/$$MODEL_FILE" --port 8004 $$LLAMA_ARGS
        healthcheck:
            test: ["CMD", "curl", "-sf", "http://localhost:8004/health"]
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 90s

    litellm:
        depends_on:
            llama-chat:
                condition: service_healthy
            llama-coder:
                condition: service_healthy
            postgres:
                condition: service_healthy
