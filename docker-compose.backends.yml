# Real llama.cpp Backends (issues #2/#3) - GPU-passthrough services for the
# Strix Halo iGPU (Vulkan/RADV, see ADR 0003). Host-specific (devices,
# group_add GIDs, model paths), so kept out of docker-compose.yml: that file
# stays portable and is what docker-compose.test.yml overlays with stub
# Backends for ./tests/run.sh.
#
# Combine with docker-compose.yml for production:
#
#   docker compose -f docker-compose.yml -f docker-compose.backends.yml up -d
#
# Or set COMPOSE_FILE=docker-compose.yml:docker-compose.backends.yml in .env
# so plain `docker compose up -d` picks up both files (see .env.example).

services:
    llama-chat:
        image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b10680
        restart: unless-stopped
        ulimits:
            memlock: -1
        ports:
            - "127.0.0.1:8001:8001"
        devices:
            - /dev/dri:/dev/dri
        group_add:
            - "${RENDER_GID}"
            - "${VIDEO_GID}"
        volumes:
            - ${MODELS_DIR}:/models:ro,z
        command:
            - -m
            - /models/${CHAT_MODEL_FILE}
            - --port
            - "8001"
            - --ctx-size
            - "524288"
            - --parallel
            - "4"
            - --flash-attn
            - "on"
            - --n-gpu-layers
            - "999"
            - --load-mode
            - mlock
            - --jinja
            - --reasoning-format
            - auto
            - --spec-type
            - draft-mtp
            - --spec-draft-n-max
            - "3"
            - --temp
            - "0.6"
            - --top-p
            - "0.95"
            - --top-k
            - "20"
            - --reasoning-preserve
            - --cont-batching
            - --metrics
        healthcheck:
            test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 300s

    llama-coder:
        image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b10680
        restart: unless-stopped
        ulimits:
            memlock: -1
        ports:
            - "127.0.0.1:8002:8002"
        devices:
            - /dev/dri:/dev/dri
        group_add:
            - "${RENDER_GID}"
            - "${VIDEO_GID}"
        volumes:
            - ${MODELS_DIR}:/models:ro,z
        command:
            - -m
            - /models/${CODER_MODEL_FILE}
            - --port
            - "8002"
            - --ctx-size
            - "262144"
            - --parallel
            - "1"
            - --flash-attn
            - "on"
            - --n-gpu-layers
            - "999"
            - --load-mode
            - mlock
            - --jinja
            - --reasoning-format
            - auto
            - --spec-type
            - draft-mtp
            - --spec-draft-n-max
            - "2"
            - --model-draft
            - /models/unsloth/Qwen3.8-27B-GGUF/MTP/mtp-Qwen3.8-27B-Q4_0.gguf
            - --temp
            - "1.0"
            - --top-p
            - "0.95"
            - --top-k
            - "20"
            - --min-p
            - "0.0"
            - --presence-penalty
            - "0.0"
            - --repeat-penalty
            - "1.0"
            - --reasoning-preserve
            - --chat-template-kwargs
            - '{"reasoning_effort": "medium"}'
            - --cont-batching
            - --metrics
        healthcheck:
            test: ["CMD", "curl", "-sf", "http://localhost:8002/health"]
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 300s

    llama-fim:
        image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b10680
        restart: unless-stopped
        ulimits:
            memlock: -1
        ports:
            - "127.0.0.1:8004:8004"
        devices:
            - /dev/dri:/dev/dri
        group_add:
            - "${RENDER_GID}"
            - "${VIDEO_GID}"
        volumes:
            - ${MODELS_DIR}:/models:ro,z
        command:
            - -m
            - /models/${FIM_MODEL_FILE}
            - --port
            - "8004"
            - --ctx-size
            - "8192"
            - --n-gpu-layers
            - "999"
            - --flash-attn
            - "on"
            - --load-mode
            - mlock
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q8_0
            - --parallel
            - "1"
            - --cache-reuse
            - "256"
            # Codestral's FIM format is Suffix-Prefix-Middle ([SUFFIX]...
            # [PREFIX]...), not the Prefix-Suffix-Middle order llama.cpp
            # assumes by default (and the previous Qwen2.5-Coder FIM model
            # used) — required for both /infill and for building raw
            # /v1/completions prompts by hand.
            - --spm-infill
            - --temp
            - "0.2"
            - --top-p
            - "0.95"
            - --top-k
            - "20"
            - --min-p
            - "0.0"
            - --repeat-penalty
            - "1.0"
        healthcheck:
            test: ["CMD", "curl", "-sf", "http://localhost:8004/health"]
            interval: 15s
            timeout: 10s
            retries: 10
            # Bumped from 60s: 22B model takes longer to load+mlock than
            # the previous 1.5B FIM model.
            start_period: 300s

    litellm:
        depends_on:
            llama-chat:
                condition: service_healthy
            llama-coder:
                condition: service_healthy
            postgres:
                condition: service_healthy
