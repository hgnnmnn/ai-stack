# Nominal per-token pricing for the local Backend. The model costs nothing
# to run; the numbers exist so spend tracking and the Grafana panels have
# non-zero values to aggregate.
x-local-cost: &local-cost
    input_cost_per_token: 0.00000002
    output_cost_per_token: 0.00000002

# max_input_tokens is HALOGEN_CTX from docker-compose.backends-halogen.yml,
# not a per-slot slice of it: unlike llama.cpp's --ctx-size / --parallel split,
# halogen's KV positions come out of one shared pool, so a single request may
# use the full native context. max_parallel_requests mirrors HALOGEN_KV_SLOTS
# so requests queue at the Gateway instead of piling up inside the engine.
#
# One Model ID, one Backend: halogen serves exactly one model and has no
# infill endpoint, so llama-coder and llama-fim are gone with the llama.cpp
# Backends (ADR 0009). The Model ID stays `llama-chat` deliberately -- it is
# the public contract (CONTEXT.md) and Clients and Keys scoped to it keep
# working across the swap, even though nothing behind it is llama.cpp anymore.
#
# The supports_* flags drive the Model Hub "Features" column and what Clients
# are told they may send. Verified live against the Backend's /health
# (`make halogen-health`), which is authoritative for the running build:
# parallel_tool_calls true, tool_choice auto/none/required/named over a
# qwen-xml wire format, and reasoning_content confirmed present on a real
# completion through the Gateway. supports_vision stays false because
# HALOGEN_VISION_TOWER is commented out -- /health reports the tower missing
# as the reason -- so turning it on is a compose change plus a flip here.
#
# Worth knowing, since drop_params is on and these go silently: n > 1,
# top_logprobs, and logprobs with stream=true are refused with a 400.
model_list:
    - model_name: llama-chat
      litellm_params:
          model: openai/llama-chat
          api_base: http://halogen:8731/v1
          api_key: "not-needed"
          max_parallel_requests: 4
          timeout: 1800
          <<: *local-cost
      model_info:
          mode: chat
          max_input_tokens: 262144
          supports_reasoning: true
          supports_function_calling: true
          supports_parallel_function_calling: true
          supports_vision: false
# Self-hosted SearXNG (search.hgn.rip) exposed as a Search Tool at
# /v1/search/searxng. Unscoped -- no key/team restriction below -- so every
# Virtual Key can call it, same as every Model ID in model_list above.
search_tools:
    - search_tool_name: searxng
      litellm_params:
          search_provider: searxng
          api_base: https://search.hgn.rip

litellm_settings:
    callbacks: ["prometheus"]
    require_auth_for_metrics_endpoint: false
    drop_params: true
    # Exact-match response cache across every deployment, including the ones
    # managed in the DB rather than here. supported_call_types is deliberately
    # left at its default so all of them are covered (chat, raw completions,
    # embeddings, rerank, responses) instead of a list that goes stale when a
    # Backend is added.
    #
    # Backed by the `redis` service in docker-compose.yml, which exists for the
    # Gateway's rate-limit/budget/router state (ADR 0007), not for this. Read
    # that ADR before treating a bigger cache as a win: f104cfd removed a
    # Valkey-backed cache from this stack precisely because exact-match caching
    # gets near-zero hit rates on multi-turn chat -- every request carries the
    # full history, so every request is unique. Redis does not change that.
    #
    # This moved off `type: local` only because that was an in-process LRU
    # hardcoded to 200 entries shared by every Model ID (Cache() takes no
    # max_size_in_memory, no env knob), so it wasn't doing much either, and
    # pointing at an already-running Redis costs nothing. llama-fim's raw
    # completions were the one workload where it might actually have paid
    # off, and ADR 0009 removed them, so expect the hit rate to go to zero.
    # If the Prometheus litellm_*cache* series confirms that, set
    # cache: false rather than trying a third backend.
    #
    # Unchanged consequence worth knowing: an identical request replays the
    # stored answer for the whole ttl, so "regenerate" in a Client returns the
    # same text even at --temp 1.0. It now also does so across restarts.
    cache: true
    cache_params:
        type: redis
        host: os.environ/REDIS_HOST
        port: os.environ/REDIS_PORT
        password: os.environ/REDIS_PASSWORD
        ttl: 600
general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY
    database_url: os.environ/DATABASE_URL
    use_x_forwarded_for: true
    mcp_trusted_proxy_ranges:
        - "10.0.0.0/24"

# Router state shared through the same Redis: deployment cooldowns, usage- and
# latency-based routing counters, rate-limit and budget accounting. Separate
# from cache_params above -- LiteLLM does not derive one from the other, and
# leaving this out is what keeps the "No Redis configured" banner up even with
# the cache pointed at Redis.
router_settings:
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    redis_password: os.environ/REDIS_PASSWORD
